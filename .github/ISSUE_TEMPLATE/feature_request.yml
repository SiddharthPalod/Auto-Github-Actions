name: ✨ Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please fill out the sections below so we can evaluate and prioritize the idea.

  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: What problem does this feature solve? Is this related to a frustration?
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like.
      placeholder: Describe the feature or behavior you want...
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: What area of the project does this relate to?
      options:
        - 🧩 New Language / Framework Plugin
        - ☁️ New Deployment Target
        - 🛡️ New Security Scanner
        - ⚡ CLI / Wizard UX
        - 🔧 Compiler / AST Optimization
        - 📦 npm Package / Distribution
        - 📖 Documentation
        - 🔄 Reconciliation / Git Integration
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered?
      placeholder: Describe alternatives...
    validations:
      required: false

  - type: textarea
    id: examples
    attributes:
      label: Examples or References
      description: Links to relevant GitHub Actions, starter workflows, or similar tools.
      placeholder: |
        - https://github.com/actions/starter-workflows/blob/main/ci/...
        - Similar tool: ...
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context, mockups, or screenshots about the feature request.
      placeholder: Add any other context here...
    validations:
      required: false
