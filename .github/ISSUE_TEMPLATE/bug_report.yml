name: 🐛 Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below so we can reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Run `npx auto-gha` in a project with...
        2. Select '...' in the wizard
        3. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe the expected behavior...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Describe the actual behavior...
    validations:
      required: true

  - type: textarea
    id: generated-yaml
    attributes:
      label: Generated YAML (if applicable)
      description: Paste the generated workflow YAML or use `--inspect` output.
      render: yaml
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: auto-gha Version
      description: Run `npx auto-gha --help` or check `package.json` for the version.
      placeholder: e.g. 1.2.0
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      description: Run `node --version` to find out.
      placeholder: e.g. v22.0.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: dropdown
    id: package-manager
    attributes:
      label: Package Manager
      description: Which package manager is in the target project?
      options:
        - npm
        - pnpm
        - yarn
        - bun
        - pip
        - cargo
        - go
        - maven
        - gradle
        - composer
        - sbt
        - Other
        - N/A
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or logs that would help.
      placeholder: Add any other context about the problem here...
    validations:
      required: false
