name: Publish to NPM

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build monorepo packages
        run: pnpm -r build

      - name: Run test suite
        run: pnpm -r test

  publish:
    name: Publish auto-gha to NPM
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build monorepo packages
        run: pnpm -r build

      - name: Publish if version updated
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          CURRENT_VERSION=$(node -p "require('./apps/cli/package.json').version")
          NPM_VERSION=$(npm view auto-gha version 2>/dev/null || echo "0.0.0")

          echo "Local version: $CURRENT_VERSION"
          echo "NPM version:   $NPM_VERSION"

          if [ "$CURRENT_VERSION" != "$NPM_VERSION" ]; then
            echo "🚀 Publishing auto-gha v$CURRENT_VERSION to NPM..."
            cd apps/cli
            npm publish --access public --provenance
          else
            echo "ℹ️ Version $CURRENT_VERSION is already published to NPM. Skipping publish."
          fi
